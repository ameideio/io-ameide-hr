name: "Pull Request Labeler"
on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/labeler@v6.0.1
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
